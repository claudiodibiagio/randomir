name = "randomir"
main = "src/worker.js"
compatibility_date = "2026-08-01"

# il gioco (index.html, motore.js, immagini) viene servito da qui
[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "PARTITA"
class_name = "Partita"

[[durable_objects.bindings]]
name = "ARCHIVIO"
class_name = "Archivio"

# le migrazioni si sommano: la v1 crea le stanze, la v2 l'archivio
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Partita"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Archivio"]
